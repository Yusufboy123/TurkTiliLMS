    StepUpContinuation:
      type: string
      enum:
        - CERTIFICATE_ISSUE_CONFIRMATION
        - CERTIFICATE_REVOKE_CONFIRMATION
    CreateStepUpChallengeRequest:
      type: object
      additionalProperties: false
      required: [action, targetType, targetId, continuation]
      properties:
        action:
          $ref: '#/components/schemas/StepUpAction'
        targetType:
          $ref: '#/components/schemas/StepUpTargetType'
        targetId:
          type: string
          format: uuid
        continuation:
          $ref: '#/components/schemas/StepUpContinuation'
    VerifyStepUpChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        confirmRecentAuthentication:
          type: boolean
          const: true
      oneOf:
        - required: [password]
        - required: [confirmRecentAuthentication]
    StepUpChallenge:
      type: object
      additionalProperties: false
      required:
        - id
        - action
        - targetType
        - targetId
        - verificationRequired
        - expiresAt
        - continuationId
      properties:
        id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/StepUpAction'
        targetType:
          $ref: '#/components/schemas/StepUpTargetType'
        targetId:
          type: string
          format: uuid
        verificationRequired:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        continuationId:
          type: string
          format: uuid
    StepUpProof:
      type: object
      additionalProperties: false
      required: [proof, expiresAt, action, targetType, targetId, continuationId]
      properties:
        proof:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        expiresAt:
          type: string
          format: date-time
        action:
          $ref: '#/components/schemas/StepUpAction'
        targetType:
          $ref: '#/components/schemas/StepUpTargetType'
        targetId:
          type: string
          format: uuid
        continuationId:
          type: string
          format: uuid
    StepUpChallengeResponse:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/StepUpChallenge'
    StepUpProofResponse:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/StepUpProof'
    CertificateActionCapabilities:
      type: object
      additionalProperties: false
      required:
        - canDownload
        - canIssue
        - canRevoke
        - canReissue
      properties:
        canDownload:
          type: boolean
        canIssue:
          type: boolean
        canRevoke:
          type: boolean
        canReissue:
          type: boolean
          const: false
    CertificateArtifactSummary:
      type: object
      additionalProperties: false
