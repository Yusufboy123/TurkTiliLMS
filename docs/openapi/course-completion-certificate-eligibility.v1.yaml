    ErrorCode:
      type: string
      enum:
        - AUTHENTICATION_REQUIRED
        - INVALID_ACCESS_TOKEN
        - ACCESS_DENIED
        - COURSE_SCOPE_DENIED
        - PROGRESS_SCOPE_DENIED
        - COURSE_NOT_FOUND
        - ENROLLMENT_NOT_FOUND
        - CERTIFICATE_NOT_FOUND
        - CERTIFICATE_VERIFICATION_NOT_FOUND
        - COMPLETION_EVIDENCE_CONFLICT
        - ELIGIBILITY_VERSION_CONFLICT
        - CERTIFICATE_EVIDENCE_CONFLICT
        - CERTIFICATE_ALREADY_ISSUED
        - CERTIFICATE_ISSUANCE_CONFLICT
        - CERTIFICATE_ALREADY_REVOKED
        - CERTIFICATE_VERSION_CONFLICT
        - CERTIFICATE_REVOKED
        - IDEMPOTENCY_KEY_REUSED
        - CERTIFICATE_NUMBERING_CONFLICT
        - COURSE_NOT_COMPLETED
        - CERTIFICATE_NOT_ELIGIBLE
        - CERTIFICATE_TEMPLATE_UNAVAILABLE
        - CERTIFICATE_ARTIFACT_GENERATION_FAILED
        - CERTIFICATE_ARTIFACT_STORAGE_FAILED
        - CERTIFICATE_ARTIFACT_UNAVAILABLE
        - VALIDATION_ERROR
        - STEP_UP_REQUIRED
        - STEP_UP_VERIFICATION_FAILED
        - STEP_UP_PROOF_EXPIRED
        - STEP_UP_PROOF_INVALID
        - RATE_LIMIT_EXCEEDED
    FieldIssue:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ErrorBody:
      type: object
      additionalProperties: false
      required: [success, code, message]
      properties:
        success:
          type: boolean
          const: false
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        requestId:
          type: string
          format: uuid
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
  responses:
    AuthenticationRequired:
      description: Authentication is required or the access token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            required:
              value:
                success: false
                code: AUTHENTICATION_REQUIRED
                message: Davom etish uchun tizimga kiring.
            invalid:
              value:
                success: false
                code: INVALID_ACCESS_TOKEN
                message: Kirish seansi yaroqsiz yoki muddati tugagan.
    AccessDenied:
      description: Role, permission, or object policy denies access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            code: ACCESS_DENIED
            message: Bu amal uchun ruxsat yetarli emas.
    CourseScopeDenied:
      description: Required role or permission is absent, or teacher is not assigned to the course
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            access:
              value:
                success: false
                code: ACCESS_DENIED
                message: Bu amal uchun ruxsat yetarli emas.
            scope:
              value:
                success: false
                code: COURSE_SCOPE_DENIED
                message: Bu kurs sizga biriktirilmagan.
    EnrollmentNotFound:
      description: Enrollment is absent or unavailable within the actor's scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            code: ENROLLMENT_NOT_FOUND
            message: Kursga yozilish ma'lumoti topilmadi.
    CourseOrEnrollmentNotFound:
      description: Course or enrollment is absent or unavailable within the actor's scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            course:
              value:
                success: false
                code: COURSE_NOT_FOUND
                message: Kurs topilmadi.
            enrollment:
              value:
                success: false
                code: ENROLLMENT_NOT_FOUND
                message: Kursga yozilish ma'lumoti topilmadi.
    CertificateNotFound:
      description: Certificate is absent or unavailable within the actor's scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            code: CERTIFICATE_NOT_FOUND
            message: Sertifikat topilmadi.
    CompletionEvidenceConflict:
      description: Canonical completion evidence is internally inconsistent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            code: COMPLETION_EVIDENCE_CONFLICT
            message: Kursni yakunlash dalillarida nomuvofiqlik aniqlandi.
    CertificateConflict:
      description: Eligibility, idempotency, issuance, revocation, or version conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            alreadyIssued:
              value:
                success: false
                code: CERTIFICATE_ALREADY_ISSUED
                message: Bu kurs yoziluvi uchun sertifikat allaqachon berilgan.
            evidenceConflict:
              value:
                success: false
                code: CERTIFICATE_EVIDENCE_CONFLICT
                message: Sertifikat dalillari joriy yakunlash ma'lumotiga mos emas.
            idempotencyConflict:
              value:
                success: false
                code: IDEMPOTENCY_KEY_REUSED
                message: Bu takrorlanmas so'rov kaliti boshqa amal uchun ishlatilgan.
            alreadyRevoked:
              value:
                success: false
                code: CERTIFICATE_ALREADY_REVOKED
                message: Sertifikat allaqachon bekor qilingan.
            versionConflict:
              value:
                success: false
                code: CERTIFICATE_VERSION_CONFLICT
                message: Sertifikat holati o'zgargan. Ma'lumotni yangilang.
    CertificateNotEligible:
      description: The enrollment is not eligible for certificate issuance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            code: CERTIFICATE_NOT_ELIGIBLE
            message: Bu kurs bo'yicha sertifikat olish shartlari bajarilmagan.
    CertificateIssueUnprocessable:
      description: Eligibility or a compatible active template is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            notEligible:
              value:
                success: false
                code: CERTIFICATE_NOT_ELIGIBLE
                message: Bu kurs bo'yicha sertifikat olish shartlari bajarilmagan.
            templateUnavailable:
              value:
                success: false
                code: CERTIFICATE_TEMPLATE_UNAVAILABLE
                message: Mos sertifikat shabloni hozir mavjud emas.
    CertificateArtifactFailure:
      description: Certificate PDF generation or storage failed before issuance committed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            generation:
              value:
                success: false
                code: CERTIFICATE_ARTIFACT_GENERATION_FAILED
                message: Sertifikat faylini yaratib bo'lmadi.
            storage:
              value:
                success: false
                code: CERTIFICATE_ARTIFACT_STORAGE_FAILED
                message: Sertifikat faylini xavfsiz saqlab bo'lmadi.
    CertificateArtifactUnavailable:
      description: Persisted certificate artifact is missing or failed integrity verification
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            code: CERTIFICATE_ARTIFACT_UNAVAILABLE
            message: Sertifikat fayli hozir mavjud emas.
    CertificateDownloadConflict:
      description: The student's certificate is revoked and cannot be downloaded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            code: CERTIFICATE_REVOKED
            message: Bekor qilingan sertifikatni yuklab bo'lmaydi.
    CertificateVerificationNotFound:
      description: Public token is unknown or malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            code: CERTIFICATE_VERIFICATION_NOT_FOUND
            message: Sertifikatni tasdiqlash ma'lumoti topilmadi.
    StepUpInvalid:
      description: Access denied, password verification failed, or the challenge is locked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            accessDenied:
              value:
                success: false
                code: ACCESS_DENIED
                message: Bu amal uchun ruxsat yetarli emas.
            verificationFailed:
              value:
                success: false
                code: STEP_UP_VERIFICATION_FAILED
                message: Shaxsni tasdiqlab bo'lmadi.
    CertificatePdf:
      description: Immutable private certificate PDF
      headers:
        Content-Disposition:
          description: Sanitized server-generated attachment filename
          schema:
            type: string
        Content-Length:
          schema:
            type: integer
            minimum: 1
            maximum: 10485760
        ETag:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            const: private, no-store
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
      content:
        application/pdf:
          schema:
            type: string
            format: binary
    ValidationFailure:
      description: Path, query, body, or header validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            code: VALIDATION_ERROR
            message: Yuborilgan ma'lumotlarni tekshiring.
    StepUpRequired:
      description: Recent authentication or a valid target-bound proof is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          examples:
            required:
              value:
                success: false
                code: STEP_UP_REQUIRED
                message: Davom etish uchun shaxsingizni qayta tasdiqlang.
            expired:
              value:
                success: false
                code: STEP_UP_PROOF_EXPIRED
                message: Shaxsni tasdiqlash muddati tugagan.
            invalid:
              value:
                success: false
                code: STEP_UP_PROOF_INVALID
                message: Shaxsni tasdiqlash ma'lumoti yaroqsiz.
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            success: false
            code: RATE_LIMIT_EXCEEDED
            message: Juda ko'p so'rov yuborildi. Birozdan so'ng qayta urinib ko'ring.
