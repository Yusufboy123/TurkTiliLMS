        status:
          $ref: '#/components/schemas/PersistedCertificateLifecycleStatus'
        version:
          type: integer
          minimum: 1
        issuedAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        safeRevocationReasonCode:
          oneOf:
            - $ref: '#/components/schemas/RevocationReasonCode'
            - type: 'null'
        templateVersion:
          type: integer
          minimum: 1
        artifact:
          $ref: '#/components/schemas/CertificateArtifactSummary'
        capabilities:
          $ref: '#/components/schemas/CertificateActionCapabilities'
    PrivateCertificateResponse:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/PrivateCertificate'
    CertificateMutationReceipt:
