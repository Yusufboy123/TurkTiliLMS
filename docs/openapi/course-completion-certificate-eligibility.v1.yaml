        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
    PrivateCertificate:
      type: object
      additionalProperties: false
      required:
        - id
        - certificateNumber
        - enrollmentId
        - course
        - recipientDisplayName
        - organizationName
        - locale
        - status
        - version
        - issuedAt
        - revokedAt
        - safeRevocationReasonCode
        - templateVersion
        - artifact
        - capabilities
      properties:
        id:
          type: string
          format: uuid
        certificateNumber:
          type: string
          pattern: '^TTL-[0-9]{4}-[0-9]{10}$'
        enrollmentId:
          type: string
          format: uuid
        course:
          $ref: '#/components/schemas/CourseReference'
        recipientDisplayName:
          type: string
          minLength: 1
          maxLength: 160
        organizationName:
          type: string
          minLength: 1
          maxLength: 200
        locale:
          type: string
