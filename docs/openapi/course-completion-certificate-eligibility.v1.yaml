openapi: 3.1.0
info:
  title: Turk Tili LMS Course Completion and Certificate Lifecycle API
  version: 1.1.0-rc.1
  description: |
    Module 8.5A defines completion and eligibility; its four read operations
    are implemented by Module 8.5C. Module 8.6A adds issuance, lifecycle,
    step-up, private artifact, download, and public verification contracts.
    Module 8.6C implements only the two step-up operations; later Module 8.6
    operations remain contract-only until their named implementation phase.
servers:
  - url: http://localhost:5000/api/v1
    description: Local development base path
tags:
  - name: Student Certificate Eligibility
  - name: Course Certificate Eligibility
  - name: Certificate Administration
  - name: Certificate Delivery
  - name: Public Certificate Verification
  - name: Step-up Authentication
paths:
  /me/enrollments/{enrollmentId}/certificate-eligibility:
    get:
      tags: [Student Certificate Eligibility]
      operationId: getOwnCertificateEligibility
      summary: Get certificate eligibility for the authenticated student's enrollment
      description: |
        Module 8.5C read boundary. Requires the STUDENT role,
        `certificate_eligibility.self_read`, and ownership of the enrollment.
        A valid incomplete enrollment returns HTTP 200 with `NOT_COMPLETED`.
      x-implementation-phase: Module 8.5C
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [certificate_eligibility.self_read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Eligibility status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateEligibilityResponse'
              examples:
                eligible:
                  $ref: '#/components/examples/EligibleResponseExample'
                notCompleted:
                  $ref: '#/components/examples/NotCompletedResponseExample'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/EnrollmentNotFound'
        '409':
          $ref: '#/components/responses/CompletionEvidenceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/enrollments/{enrollmentId}/certificate-status:
    get:
      tags: [Student Certificate Eligibility]
      operationId: getOwnCertificateStatus
      summary: Get certificate status for the authenticated student's enrollment
      description: |
        Module 8.5C read boundary. Requires the STUDENT role,
        `certificates.self_read`, and ownership of the enrollment. Module 8.5C
        may return `NOT_ISSUED`; issuance remains unavailable until Module 8.6.
      x-implementation-phase: Module 8.5C
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [certificates.self_read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Certificate status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateStatusResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/EnrollmentNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /courses/{courseId}/enrollments/{enrollmentId}/certificate-eligibility:
    get:
      tags: [Course Certificate Eligibility]
      operationId: getCourseEnrollmentCertificateEligibility
      summary: Get eligibility for an enrollment in an assigned course
      description: |
        Module 8.5C read boundary. Requires ADMIN or TEACHER,
        `certificate_eligibility.course_read`, an enrollment belonging to the
        path course, and current course assignment for a teacher. Route and
        service policies must both enforce the scope.
      x-implementation-phase: Module 8.5C
      x-implementation-status: implemented
      x-required-roles: [ADMIN, TEACHER]
      x-required-permissions: [certificate_eligibility.course_read]
      x-audit-event: certificate_eligibility.privileged_viewed
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Eligibility status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateEligibilityResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/CourseScopeDenied'
        '404':
          $ref: '#/components/responses/CourseOrEnrollmentNotFound'
        '409':
          $ref: '#/components/responses/CompletionEvidenceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /courses/{courseId}/enrollments/{enrollmentId}/certificate-status:
    get:
      tags: [Course Certificate Eligibility]
      operationId: getCourseEnrollmentCertificateStatus
      summary: Get certificate status for an enrollment in an assigned course
      description: |
        Module 8.5C read boundary. Requires ADMIN or TEACHER,
        `certificates.course_read`, an enrollment belonging to the path course,
        and current course assignment for a teacher.
      x-implementation-phase: Module 8.5C
      x-implementation-status: implemented
      x-required-roles: [ADMIN, TEACHER]
      x-required-permissions: [certificates.course_read]
      x-audit-event: certificate_eligibility.privileged_viewed
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Certificate status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateStatusResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/CourseScopeDenied'
        '404':
          $ref: '#/components/responses/CourseOrEnrollmentNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /enrollments/{enrollmentId}/certificates:
    post:
      tags: [Certificate Administration]
      operationId: issueEnrollmentCertificate
      summary: Issue a certificate from an eligible enrollment
      description: |
        Module 8.6E runtime. Requires ADMIN, `certificates.issue`, the
        exact eligible evidence and completion/curriculum versions,
        Idempotency-Key, X-Step-Up-Proof, explicit confirmation, synchronous
        staged PDF finalization, audit, and serializable duplicate protection.
        The response never exposes the verification token or storage path.
      x-implementation-phase: Module 8.6E
      x-implementation-status: implemented
      x-required-roles: [ADMIN]
      x-required-permissions: [certificates.issue]
      x-step-up-required: true
      x-rate-limit: 5 requests per 15 minutes per actor and enrollment
      x-audit-events: [certificate.issue_requested, certificate.issued]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StepUpProof'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCertificateRequest'
      responses:
        '201':
          description: Certificate issued
          headers:
            Location:
              description: Versioned API location of the issued certificate resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateMutationResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/EnrollmentNotFound'
        '409':
          $ref: '#/components/responses/CertificateConflict'
        '422':
          $ref: '#/components/responses/CertificateIssueUnprocessable'
        '424':
          $ref: '#/components/responses/CertificateArtifactFailure'
        '428':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /certificates/{certificateId}/revoke:
    post:
      tags: [Certificate Administration]
      operationId: revokeCertificate
      summary: Revoke an issued certificate
      description: |
        Module 8.6F runtime. Requires ADMIN, `certificates.revoke`,
        Idempotency-Key, a certificate-bound X-Step-Up-Proof, explicit
        confirmation, optimistic concurrency, and audit. Revocation preserves
        completion, eligibility evidence, the immutable certificate record, and
        artifact.
      x-implementation-phase: Module 8.6F
      x-implementation-status: implemented
      x-required-roles: [ADMIN]
      x-required-permissions: [certificates.revoke]
      x-step-up-required: true
      x-rate-limit: 5 requests per 15 minutes per actor and certificate
      x-audit-event: certificate.revoked
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CertificateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StepUpProof'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeCertificateRequest'
      responses:
        '200':
          description: Certificate revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateMutationResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/CertificateNotFound'
        '409':
          $ref: '#/components/responses/CertificateConflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '428':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/step-up/challenges:
    post:
      tags: [Step-up Authentication]
      operationId: createStepUpChallenge
      summary: Create a target-bound step-up challenge
      description: |
        Module 8.6C runtime. The server revalidates the current session, role,
        action-specific permission, and object scope before atomically creating
        and auditing a five-minute challenge. It never accepts an arbitrary
        return URL.
      x-implementation-phase: Module 8.6C
      x-implementation-status: implemented
      x-rate-limit: 5 requests per 15 minutes per user and session
      x-audit-event: security.step_up.challenge_created
      x-required-roles: [ADMIN]
      x-required-permissions-by-action:
        CERTIFICATE_ISSUE: [certificates.issue]
        CERTIFICATE_REVOKE: [certificates.revoke]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStepUpChallengeRequest'
      responses:
        '201':
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpChallengeResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/step-up/challenges/{challengeId}/verify:
    post:
      tags: [Step-up Authentication]
      operationId: verifyStepUpChallenge
      summary: Verify identity and create a single-use proof
      description: |
        Module 8.6C runtime. A password is required when the current session
        does not satisfy the ten-minute recent-authentication window. Success
        returns a two-minute opaque proof once; only its hash persists.
      x-implementation-phase: Module 8.6C
      x-implementation-status: implemented
      x-rate-limit: 10 requests per 15 minutes per user and privacy-safe IP key
      x-audit-events: [security.step_up.succeeded, security.step_up.failed]
      x-required-roles: [ADMIN]
      x-required-permissions-by-action:
        CERTIFICATE_ISSUE: [certificates.issue]
        CERTIFICATE_REVOKE: [certificates.revoke]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyStepUpChallengeRequest'
      responses:
        '200':
          description: Challenge verified and proof returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpProofResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/StepUpInvalid'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '428':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/certificates/{certificateId}:
    get:
      tags: [Certificate Delivery]
      operationId: getOwnCertificate
      summary: Get the authenticated student's certificate
      description: |
        Module 8.6E runtime. Requires STUDENT,
        `certificates.self_read`, and ownership through the certificate's
        enrollment.
      x-implementation-phase: Module 8.6E
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [certificates.self_read]
      x-rate-limit: 60 requests per minute per actor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CertificateId'
      responses:
        '200':
          description: Private certificate detail returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCertificateResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/CertificateNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/certificates/{certificateId}/download:
    get:
      tags: [Certificate Delivery]
      operationId: downloadOwnCertificate
      summary: Download the authenticated student's issued PDF
      description: |
        Module 8.6E runtime. Requires STUDENT,
        `certificates.self_download`, ownership, and ISSUED status. Range
        requests are not supported in v1.
      x-implementation-phase: Module 8.6E
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [certificates.self_download]
      x-rate-limit: 20 requests per minute per actor and 5 per minute per certificate
      x-audit-event: certificate.download_started
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CertificateId'
      responses:
        '200':
          $ref: '#/components/responses/CertificatePdf'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/CertificateNotFound'
        '409':
          $ref: '#/components/responses/CertificateDownloadConflict'
        '424':
          $ref: '#/components/responses/CertificateArtifactUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /courses/{courseId}/certificates/{certificateId}:
    get:
      tags: [Certificate Delivery]
      operationId: getCourseCertificate
      summary: Get certificate detail in an authorized course scope
      description: |
        Module 8.6E runtime. Requires ADMIN or TEACHER,
        `certificates.course_read`, a certificate belonging to the path course,
        and current course assignment for a teacher. This privileged read is
        audited.
      x-implementation-phase: Module 8.6E
      x-implementation-status: implemented
      x-required-roles: [ADMIN, TEACHER]
      x-required-permissions: [certificates.course_read]
      x-audit-event: certificate.privileged_viewed
      x-rate-limit: 60 requests per minute per actor
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/CertificateId'
      responses:
        '200':
          description: Scoped management detail returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateCertificateResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/CourseScopeDenied'
        '404':
          $ref: '#/components/responses/CertificateNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /courses/{courseId}/certificates/{certificateId}/download:
    get:
      tags: [Certificate Delivery]
      operationId: downloadCourseCertificate
      summary: Download a certificate PDF for an administrative purpose
      description: |
        Module 8.6E runtime. Requires ADMIN and
        `certificates.download`. Revoked artifacts may be retrieved by this
        endpoint for investigation. Every successful access is audited. Teachers
        cannot download certificate artifacts in v1.
      x-implementation-phase: Module 8.6E
      x-implementation-status: implemented
      x-required-roles: [ADMIN]
      x-required-permissions: [certificates.download]
      x-audit-event: certificate.download_started
      x-rate-limit: 20 requests per minute per actor and 5 per minute per certificate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/CertificateId'
      responses:
        '200':
          $ref: '#/components/responses/CertificatePdf'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/CertificateNotFound'
        '424':
          $ref: '#/components/responses/CertificateArtifactUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /public/certificates/verify/{verificationToken}:
    get:
      tags: [Public Certificate Verification]
      operationId: verifyPublicCertificate
      summary: Verify a certificate through its opaque public token
      description: |
        Module 8.6F runtime. Authentication is not required. Unknown and
        malformed tokens receive the same generic 404. An approved
        recipient-name suppression returns a valid status with a null name.
        The raw token must not be logged or copied into analytics.
      x-implementation-phase: Module 8.6F
      x-implementation-status: implemented
      x-rate-limit: 20 requests per minute per privacy-safe IP key plus a global abuse limit
      x-audit-event: certificate.verification_viewed
      security: []
      parameters:
        - $ref: '#/components/parameters/VerificationToken'
      responses:
        '200':
          description: Privacy-limited verification result returned
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
            X-Robots-Tag:
              schema:
                type: string
                const: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCertificateVerificationResponse'
        '404':
          $ref: '#/components/responses/CertificateVerificationNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CertificateId:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChallengeId:
      name: challengeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VerificationToken:
      name: verificationToken
      in: path
      required: true
      description: Unpadded base64url encoding of 32 random bytes
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Actor-scoped key for one logical mutation. Reusing the key with a
        different request is rejected.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    StepUpProof:
      name: X-Step-Up-Proof
      in: header
      required: true
      description: |
        Opaque, single-use proof bound to the authenticated user, session,
        protected action, and target. It expires two minutes after verification.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: '^[A-Za-z0-9_-]{43}$'
  schemas:
    CourseReference:
      type: object
      additionalProperties: false
      required: [id, title, slug]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
    CompletionStatus:
      type: string
      enum: [NOT_COMPLETED, COMPLETED]
    EligibilityStatus:
      type: string
      description: |
        NOT_ELIGIBLE is reserved for a future approved policy with requirements
        beyond completion. V1 completion-only evaluation emits NOT_COMPLETED or
        ELIGIBLE.
      enum: [NOT_COMPLETED, NOT_ELIGIBLE, ELIGIBLE]
    EligibilityPolicyCode:
      type: string
      enum: [COURSE_COMPLETION_ONLY]
    EligibilityReasonCode:
      type: string
      enum:
        - COURSE_NOT_COMPLETED
        - ZERO_ELIGIBLE_LESSONS
        - COMPLETION_EVIDENCE_UNAVAILABLE
        - POLICY_REQUIREMENTS_NOT_MET
    CertificateLifecycleStatus:
      type: string
      enum: [NOT_ISSUED, ISSUED, REVOKED]
    PersistedCertificateLifecycleStatus:
      type: string
      enum: [ISSUED, REVOKED]
    RevocationReasonCode:
      type: string
      enum:
        - FRAUD
        - ADMINISTRATIVE_ERROR
        - DUPLICATE_ISSUANCE
        - POLICY_VIOLATION
        - OTHER
    CompletionEvidenceSummary:
      type: object
      additionalProperties: false
      required:
        - status
        - completedAt
        - completionCurriculumVersion
        - completionVersion
        - completedLessons
        - totalEligibleLessons
        - percentage
      properties:
        status:
          $ref: '#/components/schemas/CompletionStatus'
        completedAt:
          type: [string, 'null']
          format: date-time
        completionCurriculumVersion:
          type: [integer, 'null']
          minimum: 1
        completionVersion:
          type: [integer, 'null']
          minimum: 0
        completedLessons:
          type: integer
          minimum: 0
        totalEligibleLessons:
          type: integer
          minimum: 0
        percentage:
          type: integer
          minimum: 0
          maximum: 100
    EligibilityDecision:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - policyCode
        - policyVersion
        - evaluationVersion
        - evaluatedAt
        - reasonCodes
      properties:
        id:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/EligibilityStatus'
        policyCode:
          oneOf:
            - $ref: '#/components/schemas/EligibilityPolicyCode'
            - type: 'null'
        policyVersion:
          type: [integer, 'null']
          minimum: 1
        evaluationVersion:
          type: [integer, 'null']
          minimum: 1
        evaluatedAt:
          type: [string, 'null']
          format: date-time
        reasonCodes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EligibilityReasonCode'
    CertificateCapabilities:
      type: object
      additionalProperties: false
      required:
        - canReadEligibility
        - canReadCertificateStatus
        - canIssueCertificate
        - canRevokeCertificate
      properties:
        canReadEligibility:
          type: boolean
        canReadCertificateStatus:
          type: boolean
        canIssueCertificate:
          type: boolean
        canRevokeCertificate:
          type: boolean
    CertificateEligibility:
      type: object
      additionalProperties: false
      required: [enrollmentId, course, completion, eligibility, capabilities]
      properties:
        enrollmentId:
          type: string
          format: uuid
        course:
          $ref: '#/components/schemas/CourseReference'
        completion:
          $ref: '#/components/schemas/CompletionEvidenceSummary'
        eligibility:
          $ref: '#/components/schemas/EligibilityDecision'
        capabilities:
          $ref: '#/components/schemas/CertificateCapabilities'
    CertificateReference:
      type: object
      additionalProperties: false
      required:
        - id
        - certificateNumber
        - status
        - issuedAt
        - revokedAt
        - safeRevocationReasonCode
        - version
      properties:
        id:
          type: string
          format: uuid
        certificateNumber:
          type: string
        status:
          $ref: '#/components/schemas/PersistedCertificateLifecycleStatus'
        issuedAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        safeRevocationReasonCode:
          oneOf:
            - $ref: '#/components/schemas/RevocationReasonCode'
            - type: 'null'
        version:
          type: integer
          minimum: 1
    EnrollmentCertificateStatus:
      type: object
      additionalProperties: false
      required: [enrollmentId, course, status, certificate, capabilities]
      properties:
        enrollmentId:
          type: string
          format: uuid
        course:
          $ref: '#/components/schemas/CourseReference'
        status:
