          format: uuid
        enrollmentId:
          type: string
          format: uuid
        certificateNumber:
          type: string
          pattern: '^TTL-[0-9]{4}-[0-9]{10}$'
        resultingStatus:
          $ref: '#/components/schemas/PersistedCertificateLifecycleStatus'
        resultingVersion:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
    CertificateMutationResponse:
