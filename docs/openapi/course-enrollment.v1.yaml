openapi: 3.1.0
info:
  title: Turk Tili LMS Course Enrollment API
  version: 1.1.0
  description: |
    Versioned course-enrollment lifecycle API. Route middleware and the service
    layer both enforce the documented role and permission requirements.
servers:
  - url: http://localhost:5000/api/v1
tags:
  - name: Student Enrollments
  - name: Enrollment Management
paths:
  /courses/{courseId}/enrollments/self:
    post:
      tags: [Student Enrollments]
      summary: Enroll the authenticated student
      description: Requires the STUDENT role and `enrollments.self_create`.
      x-required-roles: [STUDENT]
      x-required-permissions: [enrollments.self_create]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Student enrolled
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfEnrollmentResponse'
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/CourseNotFound' }
        '409': { $ref: '#/components/responses/EnrollmentConflict' }
        '422': { $ref: '#/components/responses/ValidationOrEligibilityError' }
  /me/enrollments:
    get:
      tags: [Student Enrollments]
      summary: List the authenticated student's enrollments
      description: Requires the STUDENT role and `enrollments.self_read`.
      x-required-roles: [STUDENT]
      x-required-permissions: [enrollments.self_read]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Status'
        - name: courseId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDirection'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: Paginated student-safe enrollment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfEnrollmentPageResponse'
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '422': { $ref: '#/components/responses/ValidationOrEligibilityError' }
  /me/enrollments/{enrollmentId}:
    get:
      tags: [Student Enrollments]
      summary: Get an owned enrollment
      description: Requires the STUDENT role and `enrollments.self_read`.
      x-required-roles: [STUDENT]
      x-required-permissions: [enrollments.self_read]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Student-safe enrollment returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfEnrollmentResponse'
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/EnrollmentNotFound' }
        '422': { $ref: '#/components/responses/ValidationOrEligibilityError' }
  /me/enrollments/{enrollmentId}/cancel:
    post:
      tags: [Student Enrollments]
      summary: Cancel an owned ACTIVE enrollment
      description: Requires the STUDENT role and `enrollments.self_cancel`.
      x-required-roles: [STUDENT]
      x-required-permissions: [enrollments.self_cancel]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Enrollment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfEnrollmentResponse'
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/EnrollmentNotFound' }
        '409': { $ref: '#/components/responses/EnrollmentConflict' }
        '422': { $ref: '#/components/responses/ValidationOrEligibilityError' }
    patch:
      tags: [Student Enrollments]
      summary: Cancel an owned ACTIVE enrollment
      description: Compatibility alias for POST; requires `enrollments.self_cancel`.
      x-required-roles: [STUDENT]
      x-required-permissions: [enrollments.self_cancel]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Enrollment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfEnrollmentResponse'
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/EnrollmentNotFound' }
        '409': { $ref: '#/components/responses/EnrollmentConflict' }
        '422': { $ref: '#/components/responses/ValidationOrEligibilityError' }
  /courses/{courseId}/enrollments:
    post:
      tags: [Enrollment Management]
      summary: Enroll an eligible student in a permitted course
      description: Requires ADMIN or TEACHER and `enrollments.create`; teachers are course-scoped.
      x-required-roles: [ADMIN, TEACHER]
      x-required-permissions: [enrollments.create]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [studentId]
              properties:
                studentId: { type: string, format: uuid }
      responses:
        '201':
          description: Student enrolled
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedEnrollmentResponse'
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/CourseNotFound' }
        '409': { $ref: '#/components/responses/EnrollmentConflict' }
        '422': { $ref: '#/components/responses/ValidationOrEligibilityError' }
    get:
      tags: [Enrollment Management]
      summary: List enrollments in a permitted course
      description: Requires ADMIN or TEACHER and `enrollments.read`; teachers are course-scoped.
      x-required-roles: [ADMIN, TEACHER]
      x-required-permissions: [enrollments.read]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDirection'
        - $ref: '#/components/parameters/SortOrder'
        - name: source
          in: query
          schema: { $ref: '#/components/schemas/EnrollmentSource' }
        - name: studentId
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: enrolledFrom
          in: query
          schema: { type: string, format: date-time }
        - name: enrolledTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated management enrollment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedEnrollmentPageResponse'
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/CourseNotFound' }
        '422': { $ref: '#/components/responses/ValidationOrEligibilityError' }
  /enrollments/{enrollmentId}:
    get:
      tags: [Enrollment Management]
      summary: Get an enrollment in the manager's course scope
      description: Requires ADMIN or TEACHER and `enrollments.read`; teachers are course-scoped.
      x-required-roles: [ADMIN, TEACHER]
      x-required-permissions: [enrollments.read]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Management enrollment returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedEnrollmentResponse'
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/EnrollmentNotFound' }
        '422': { $ref: '#/components/responses/ValidationOrEligibilityError' }
  /enrollments/{enrollmentId}/status:
    patch:
      tags: [Enrollment Management]
      summary: Apply an explicit enrollment lifecycle transition
      description: |
        Requires ADMIN or TEACHER and `enrollments.update_status`; teachers are
        course-scoped. Reactivation revalidates course and student eligibility.
      x-required-roles: [ADMIN, TEACHER]
      x-required-permissions: [enrollments.update_status]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/EnrollmentStatus' }
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedEnrollmentResponse'
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/EnrollmentNotFound' }
        '409': { $ref: '#/components/responses/EnrollmentConflict' }
        '422': { $ref: '#/components/responses/ValidationOrEligibilityError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: Cannot be combined with `limit`.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Limit:
      name: limit
      in: query
      description: Compatibility alias for `pageSize`; cannot be combined with it.
      schema: { type: integer, minimum: 1, maximum: 100 }
    Status:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/EnrollmentStatus' }
    SortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum: [enrolledAt, createdAt, updatedAt, status]
        default: enrolledAt
    SortDirection:
      name: sortDirection
      in: query
      description: Cannot be combined with `sortOrder`.
      schema:
        type: string
        enum: [asc, desc]
    SortOrder:
      name: sortOrder
      in: query
      description: Compatibility alias for `sortDirection`; cannot be combined with it.
      schema:
        type: string
        enum: [asc, desc]
        default: desc
  responses:
    AuthenticationRequired:
      description: Authentication is required or the supplied access token is invalid
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  code:
                    type: string
                    enum: [AUTHENTICATION_REQUIRED, INVALID_ACCESS_TOKEN]
    AccessDenied:
      description: Missing role, permission, or course scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CourseNotFound:
      description: Course was not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    EnrollmentNotFound:
      description: Enrollment was not found or is outside the caller's ownership
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    EnrollmentConflict:
      description: Enrollment lifecycle, eligibility, or concurrency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationOrEligibilityError:
      description: Request validation failed or the student is ineligible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    EnrollmentStatus:
      type: string
      enum: [ACTIVE, COMPLETED, CANCELLED, SUSPENDED]
    EnrollmentSource:
      type: string
      enum: [SELF, ADMIN]
    EnrollmentCore:
      type: object
      required:
        - id
        - courseId
        - studentId
        - status
        - source
        - enrolledAt
        - startedAt
        - completedAt
        - cancelledAt
        - suspendedAt
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/EnrollmentStatus' }
        source: { $ref: '#/components/schemas/EnrollmentSource' }
        enrolledAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        suspendedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CourseSummary:
      type: object
      additionalProperties: false
      required: [id, title, slug]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
    ManagedCourseSummary:
      type: object
      additionalProperties: false
      required: [id, title, slug, teacherId]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        teacherId: { type: [string, 'null'], format: uuid }
    StudentSummary:
      type: object
      additionalProperties: false
      required: [id, email, firstName, lastName, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        displayName: { type: [string, 'null'] }
    SelfEnrollment:
      allOf:
        - $ref: '#/components/schemas/EnrollmentCore'
        - type: object
          required: [course, student]
          properties:
            course: { $ref: '#/components/schemas/CourseSummary' }
            student: { $ref: '#/components/schemas/StudentSummary' }
      unevaluatedProperties: false
    ManagedEnrollment:
      allOf:
        - $ref: '#/components/schemas/EnrollmentCore'
        - type: object
          required: [createdById, course, student]
          properties:
            createdById: { type: [string, 'null'], format: uuid }
            course: { $ref: '#/components/schemas/ManagedCourseSummary' }
            student: { $ref: '#/components/schemas/StudentSummary' }
      unevaluatedProperties: false
    Pagination:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    SelfEnrollmentPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SelfEnrollment' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    ManagedEnrollmentPage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ManagedEnrollment' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    SelfEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/SelfEnrollment' }
    ManagedEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/ManagedEnrollment' }
    SelfEnrollmentPageResponse:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/SelfEnrollmentPage' }
    ManagedEnrollmentPageResponse:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { $ref: '#/components/schemas/ManagedEnrollmentPage' }
    ErrorResponse:
      type: object
      additionalProperties: true
      required: [success, code, message]
      properties:
        success: { type: boolean, const: false }
        code:
          type: string
          enum:
            - AUTHENTICATION_REQUIRED
            - INVALID_ACCESS_TOKEN
            - ACCESS_DENIED
            - COURSE_SCOPE_DENIED
            - COURSE_NOT_FOUND
            - COURSE_NOT_ENROLLABLE
            - STUDENT_NOT_ELIGIBLE
            - ENROLLMENT_NOT_FOUND
            - ALREADY_ENROLLED
            - ENROLLMENT_SUSPENDED
            - ENROLLMENT_COMPLETED
            - ENROLLMENT_NOT_CANCELLABLE
            - INVALID_ENROLLMENT_STATUS_TRANSITION
            - ENROLLMENT_CONFLICT
            - ENROLLMENT_REFERENCE_CONFLICT
            - VALIDATION_ERROR
            - INTERNAL_SERVER_ERROR
        message: { type: string }
        details: {}
