openapi: 3.1.0
info:
  title: Turk Tili LMS Progress Tracking API
  version: 1.0.0
  description: |
    Backend-authoritative progress contract approved in Module 8.1A. Student
    operations are implemented by Module 8.2. Teacher and administrator
    reporting boundaries are implemented by Module 8.4. Export is intentionally unavailable.
    Route middleware and the service layer both enforce documented
    role, permission, ownership, enrollment-state, and resource-scope policies.
servers:
  - url: http://localhost:5000/api/v1
    description: Local development base path
tags:
  - name: Student Progress
  - name: Teacher Progress
  - name: Administrator Progress
paths:
  /me/progress:
    get:
      tags: [Student Progress]
      operationId: getOwnProgressSummary
      summary: Retrieve the authenticated student's progress summary
      description: |
        Requires the STUDENT role and `progress.self_read`. Returns only the
        authenticated student's progress and a backend-selected global resume
        target. This operation is implemented by Module 8.2.
      x-implementation-phase: Module 8.2
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [progress.self_read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActiveLimit'
      responses:
        '200':
          description: Personal progress summary returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgressSummaryResponse'
              examples:
                summary:
                  $ref: '#/components/examples/StudentProgressSummaryExample'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/progress/completed-courses:
    get:
      tags: [Student Progress]
      operationId: listOwnCompletedCourses
      summary: List the authenticated student's completed courses
      description: |
        Requires the STUDENT role and `progress.self_read`. Returns frozen
        terminal completion snapshots only. This operation is planned for
        Module 8.2.
      x-implementation-phase: Module 8.2
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [progress.self_read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [completedAt, enrolledAt]
            default: completedAt
        - $ref: '#/components/parameters/SortDirection'
      responses:
        '200':
          description: Completed-course page returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedCoursePageResponse'
              examples:
                completedCourses:
                  $ref: '#/components/examples/CompletedCoursePageExample'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/enrollments/{enrollmentId}/progress:
    get:
      tags: [Student Progress]
      operationId: getOwnEnrollmentProgress
      summary: Retrieve hierarchical progress for one owned enrollment
      description: |
        Requires the STUDENT role, `progress.self_read`, and enrollment
        ownership. SUSPENDED, CANCELLED, and COMPLETED history is readable but
        has no mutation or resume capabilities. This operation is planned for
        Module 8.2.
      x-implementation-phase: Module 8.2
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [progress.self_read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Authoritative course progress returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgressResponse'
              examples:
                courseProgress:
                  $ref: '#/components/examples/CourseProgressExample'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ProgressScopeDenied'
        '404':
          $ref: '#/components/responses/EnrollmentNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/enrollments/{enrollmentId}/progress/resume:
    get:
      tags: [Student Progress]
      operationId: getOwnEnrollmentResumeTarget
      summary: Retrieve the authoritative resume target for one enrollment
      description: |
        Requires the STUDENT role, `progress.self_read`, and ownership. The
        result is null for non-ACTIVE enrollment, unavailable course, completed
        curriculum, or no eligible incomplete lesson. No playback position or
        block offset is returned. This operation is implemented by Module 8.2.
      x-implementation-phase: Module 8.2
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [progress.self_read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Resume target or null returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeLearningResponse'
              examples:
                target:
                  $ref: '#/components/examples/ResumeLearningExample'
                noTarget:
                  value:
                    success: true
                    message: Davom ettirish uchun dars mavjud emas.
                    data: null
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ProgressScopeDenied'
        '404':
          $ref: '#/components/responses/EnrollmentNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/enrollments/{enrollmentId}/progress/blocks/{blockId}/complete:
    post:
      tags: [Student Progress]
      operationId: completeOwnContentBlock
      summary: Mark one eligible content block complete
      description: |
        Requires the STUDENT role, `progress.self_complete`, ownership, ACTIVE
        enrollment, current curriculum version, expected completion version,
        and an Idempotency-Key. Repeating the same effective operation succeeds
        with changed=false. This operation is implemented by Module 8.2.
      x-implementation-phase: Module 8.2
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [progress.self_complete]
      x-idempotency-required: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/BlockId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CompletionMutation'
      responses:
        '200':
          $ref: '#/components/responses/ProgressMutationSucceeded'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/MutationDenied'
        '404':
          $ref: '#/components/responses/ProgressResourceNotFound'
        '409':
          $ref: '#/components/responses/ProgressConflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/enrollments/{enrollmentId}/progress/blocks/{blockId}/reopen:
    post:
      tags: [Student Progress]
      operationId: reopenOwnContentBlock
      summary: Reopen one completed content block
      description: |
        Requires the STUDENT role, `progress.self_reopen`, ownership, ACTIVE
        nonterminal progress, current versions, and an Idempotency-Key. Reading
        completed content is not this operation. This operation is planned for
        Module 8.2.
      x-implementation-phase: Module 8.2
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [progress.self_reopen]
      x-idempotency-required: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/BlockId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CompletionMutation'
      responses:
        '200':
          $ref: '#/components/responses/ProgressMutationSucceeded'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/MutationDenied'
        '404':
          $ref: '#/components/responses/ProgressResourceNotFound'
        '409':
          $ref: '#/components/responses/ProgressConflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/enrollments/{enrollmentId}/progress/lessons/{lessonId}/complete:
    post:
      tags: [Student Progress]
      operationId: completeOwnLesson
      summary: Explicitly complete one eligible lesson
      description: |
        Requires the STUDENT role, `progress.self_complete`, ownership, ACTIVE
        enrollment, all required eligible blocks complete, current versions,
        and an Idempotency-Key. Completing the final eligible lesson may
        atomically complete the enrollment. This operation is planned for
        Module 8.2.
      x-implementation-phase: Module 8.2
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [progress.self_complete]
      x-idempotency-required: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CompletionMutation'
      responses:
        '200':
          $ref: '#/components/responses/ProgressMutationSucceeded'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/MutationDenied'
        '404':
          $ref: '#/components/responses/ProgressResourceNotFound'
        '409':
          $ref: '#/components/responses/ProgressConflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/enrollments/{enrollmentId}/progress/lessons/{lessonId}/reopen:
    post:
      tags: [Student Progress]
      operationId: reopenOwnLesson
      summary: Reopen one completed lesson before terminal course completion
      description: |
        Requires the STUDENT role, `progress.self_reopen`, ownership, ACTIVE
        nonterminal progress, current versions, and an Idempotency-Key. A
        COMPLETED enrollment cannot reopen in v1. This operation is planned for
        Module 8.2.
      x-implementation-phase: Module 8.2
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [progress.self_reopen]
      x-idempotency-required: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CompletionMutation'
      responses:
        '200':
          $ref: '#/components/responses/ProgressMutationSucceeded'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/MutationDenied'
        '404':
          $ref: '#/components/responses/ProgressResourceNotFound'
        '409':
          $ref: '#/components/responses/ProgressConflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/enrollments/{enrollmentId}/progress/last-visited-lesson:
    put:
      tags: [Student Progress]
      operationId: recordOwnLastVisitedLesson
      summary: Record the last visited eligible lesson
      description: |
        Requires the STUDENT role, `progress.self_record_visit`, ownership,
        ACTIVE enrollment, current curriculum version, and an Idempotency-Key.
        It increments activityVersion but not completionVersion and never
        completes content. Legitimate concurrent visits use last-committed server
        order. This operation is implemented by Module 8.2.
      x-implementation-phase: Module 8.2
      x-implementation-status: implemented
      x-required-roles: [STUDENT]
      x-required-permissions: [progress.self_record_visit]
      x-idempotency-required: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordLastVisitedLessonRequest'
            example:
              lessonId: 019c0000-0000-7000-8000-000000000004
              curriculumVersion: 4
      responses:
        '200':
          description: Last visited lesson recorded or idempotently replayed
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityMutationResponse'
              examples:
                recorded:
                  $ref: '#/components/examples/ActivityMutationExample'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/MutationDenied'
        '404':
          $ref: '#/components/responses/ProgressResourceNotFound'
        '409':
          $ref: '#/components/responses/ProgressConflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /courses/{courseId}/progress:
    get:
      tags: [Teacher Progress]
      operationId: listTeacherCourseProgress
      summary: List student progress for a teacher-owned course
      description: |
        Implemented in Module 8.4. Requires ADMIN or TEACHER,
        `progress.course.read`, and for a teacher the current course owner scope.
      x-implementation-phase: Module 8.4
      x-implementation-status: implemented
      x-required-roles: [ADMIN, TEACHER]
      x-required-permissions: [progress.course.read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/EnrollmentStatusFilter'
        - $ref: '#/components/parameters/ProgressStateFilter'
        - $ref: '#/components/parameters/ReportingSortBy'
        - $ref: '#/components/parameters/SortDirection'
      responses:
        '200':
          description: Teacher-scoped progress page returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourseProgressPageResponse'
              examples:
                reporting:
                  $ref: '#/components/examples/TeacherCourseProgressPageExample'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ReportingDenied'
        '404':
          $ref: '#/components/responses/CourseNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /courses/{courseId}/progress/enrollments/{enrollmentId}:
    get:
      tags: [Teacher Progress]
      operationId: getTeacherStudentProgress
      summary: Retrieve one student's progress in a teacher-owned course
      description: |
        Implemented in Module 8.4. Requires ADMIN or TEACHER,
        `progress.course.read`, course ownership for a teacher, and an enrollment
        belonging to the path course.
      x-implementation-phase: Module 8.4
      x-implementation-status: implemented
      x-required-roles: [ADMIN, TEACHER]
      x-required-permissions: [progress.course.read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Teacher-scoped student detail returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherStudentProgressResponse'
              examples:
                detail:
                  $ref: '#/components/examples/TeacherStudentProgressExample'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ReportingDenied'
        '404':
          $ref: '#/components/responses/ProgressResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /progress:
    get:
      tags: [Administrator Progress]
      operationId: listAdministratorProgress
      summary: Search permission-scoped progress records
      description: |
        Implemented in Module 8.4. Requires ADMIN and `progress.read`. It is not
        an export endpoint.
      x-implementation-phase: Module 8.4
      x-implementation-status: implemented
      x-required-roles: [ADMIN]
      x-required-permissions: [progress.read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: courseId
          in: query
          schema:
            type: string
            format: uuid
        - name: studentId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/EnrollmentStatusFilter'
        - $ref: '#/components/parameters/ProgressStateFilter'
        - $ref: '#/components/parameters/ReportingSortBy'
        - $ref: '#/components/parameters/SortDirection'
      responses:
        '200':
          description: Administrator progress page returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProgressPageResponse'
              examples:
                reporting:
                  $ref: '#/components/examples/AdminProgressPageExample'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ReportingDenied'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
  /progress/enrollments/{enrollmentId}:
    get:
      tags: [Administrator Progress]
      operationId: getAdministratorEnrollmentProgress
      summary: Retrieve one permission-scoped enrollment progress detail
      description: |
        Implemented in Module 8.4. Requires ADMIN and `progress.read`. This
        operation exposes no internal progress events.
      x-implementation-phase: Module 8.4
      x-implementation-status: implemented
      x-required-roles: [ADMIN]
      x-required-permissions: [progress.read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Administrator-scoped detail returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherStudentProgressResponse'
              examples:
                detail:
                  $ref: '#/components/examples/TeacherStudentProgressExample'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/ReportingDenied'
        '404':
          $ref: '#/components/responses/EnrollmentNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BlockId:
      name: blockId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Actor-scoped key for one normalized operation. UUIDv4 or UUIDv7 is
        recommended. Reuse with a different request fingerprint returns
        IDEMPOTENCY_KEY_CONFLICT.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{16,128}$'
      example: 019c0000-0000-7000-8000-000000000099
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ActiveLimit:
      name: activeLimit
      in: query
      description: Maximum active-course summaries embedded in the dashboard response.
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 5
    Search:
      name: search
      in: query
      description: Case-insensitive permitted student identity search.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    EnrollmentStatusFilter:
      name: enrollmentStatus
      in: query
      schema:
        $ref: '#/components/schemas/EnrollmentStatus'
    ProgressStateFilter:
      name: progressState
      in: query
      schema:
        $ref: '#/components/schemas/CourseProgressState'
    ReportingSortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum: [lastActivityAt, completedAt, percentage, enrolledAt, studentName]
        default: lastActivityAt
    SortDirection:
      name: sortDirection
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
  headers:
    IdempotencyReplayed:
      description: True when the successful response was replayed from an actor-scoped key.
      schema:
        type: boolean
        default: false
  requestBodies:
    CompletionMutation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompletionMutationRequest'
          example:
            expectedCompletionVersion: 7
            curriculumVersion: 4
  responses:
    AuthenticationRequired:
      description: Authentication is required or the access token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              value:
                success: false
                code: AUTHENTICATION_REQUIRED
                message: Davom etish uchun tizimga kirish talab qilinadi.
            invalid:
              value:
                success: false
                code: INVALID_ACCESS_TOKEN
                message: Kirish sessiyasi yaroqsiz yoki muddati tugagan.
    AccessDenied:
      description: Required role or permission is missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: ACCESS_DENIED
            message: Bu amal uchun ruxsat yetarli emas.
    ProgressScopeDenied:
      description: Progress is outside the authenticated student's ownership
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: PROGRESS_SCOPE_DENIED
            message: Bu o‘qish jarayonini ko‘rishga ruxsat yetarli emas.
    ReportingDenied:
      description: Reporting permission or teacher course scope is missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            permission:
              value:
                success: false
                code: ACCESS_DENIED
                message: Bu amal uchun ruxsat yetarli emas.
            courseScope:
              value:
                success: false
                code: COURSE_SCOPE_DENIED
                message: Bu kurs sizga biriktirilmagan.
    MutationDenied:
      description: Mutation permission, ownership, or reopen policy denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            permission:
              value:
                success: false
                code: ACCESS_DENIED
                message: Bu amal uchun ruxsat yetarli emas.
            reopen:
              value:
                success: false
                code: REOPEN_NOT_PERMITTED
                message: Bu elementni qayta ochishga ruxsat berilmagan.
    EnrollmentNotFound:
      description: Enrollment was not found or is hidden by ownership policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: ENROLLMENT_NOT_FOUND
            message: Enrollment topilmadi.
    CourseNotFound:
      description: Course was not found in the permitted scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: COURSE_NOT_FOUND
            message: Kurs topilmadi.
    ProgressResourceNotFound:
      description: Enrollment, lesson, or content block was not found in scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            enrollment:
              value:
                success: false
                code: ENROLLMENT_NOT_FOUND
                message: Enrollment topilmadi.
            lesson:
              value:
                success: false
                code: LESSON_NOT_FOUND
                message: Dars topilmadi.
            block:
              value:
                success: false
                code: CONTENT_BLOCK_NOT_FOUND
                message: Dars materiali topilmadi.
    ProgressConflict:
      description: Enrollment, curriculum, completion, eligibility, or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            curriculum:
              value:
                success: false
                code: CURRICULUM_VERSION_CONFLICT
                message: Kurs tarkibi yangilandi. Jarayonni qayta yuklang.
            completion:
              value:
                success: false
                code: COMPLETION_VERSION_CONFLICT
                message: O‘qish jarayoni boshqa qurilmada yangilangan. Ma’lumotlarni qayta yuklang.
            idempotency:
              value:
                success: false
                code: IDEMPOTENCY_KEY_CONFLICT
                message: Takroriy so‘rov kaliti boshqa amal uchun ishlatilgan.
            requirements:
              value:
                success: false
                code: LESSON_COMPLETION_REQUIREMENTS_NOT_MET
                message: Darsni tugallash uchun majburiy materiallarni yakunlang.
    ValidationFailure:
      description: Path, query, header, or body validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: VALIDATION_ERROR
            message: Kiritilgan ma’lumotlarni tekshiring.
            details:
              - path: expectedCompletionVersion
                message: Qiymat manfiy bo‘lmasligi kerak.
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: RATE_LIMIT_EXCEEDED
            message: Juda ko‘p so‘rov yuborildi. Birozdan so‘ng qayta urinib ko‘ring.
    ProgressMutationSucceeded:
      description: Progress mutation committed or returned idempotently
