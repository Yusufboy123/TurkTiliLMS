        - exerciseCount
        - completedCount
        - correctCount
        - incorrectCount
        - earnedPoints
        - totalPoints
        - streak
        - xp
      properties:
        status:
          type: string
          const: IN_PROGRESS
        currentQuestionNumber:
          type: integer
          const: 1
        exerciseCount:
          type: integer
          minimum: 1
          maximum: 12
        completedCount:
          type: integer
          const: 0
        correctCount:
          type: integer
          const: 0
        incorrectCount:
          type: integer
          const: 0
        earnedPoints:
          type: integer
          const: 0
        totalPoints:
          type: integer
          minimum: 1
        streak:
          type: integer
          const: 0
        xp:
          type: integer
          const: 0
    StandardAttemptCreated:
      allOf:
        - $ref: '#/components/schemas/AttemptCreated'
