          $ref: '#/components/headers/PublicMediaRevalidate'
        Content-Disposition:
          $ref: '#/components/headers/SafeAudioDisposition'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/AudioContentType'
        ETag:
          $ref: '#/components/headers/ETag'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        audio/mpeg:
          schema:
            type: string
            format: binary
        audio/wav:
          schema:
            type: string
            format: binary
    PartialAudioContent:
      description: Requested single byte range returned.
      headers:
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        Cache-Control:
          $ref: '#/components/headers/PublicMediaRevalidate'
        Content-Disposition:
          $ref: '#/components/headers/SafeAudioDisposition'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Range:
          $ref: '#/components/headers/ContentRange'
        Content-Type:
          $ref: '#/components/headers/AudioContentType'
        ETag:
          $ref: '#/components/headers/ETag'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        audio/mpeg:
          schema:
            type: string
            format: binary
        audio/wav:
          schema:
            type: string
            format: binary
    RangeNotSatisfiable:
      description: Range is invalid, multipart, or outside the representation.
      headers:
        Content-Range:
          $ref: '#/components/headers/UnsatisfiedContentRange'
        Cache-Control:
          $ref: '#/components/headers/PublicMediaRevalidate'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
