              maxItems: 12
              items:
                $ref: '#/components/schemas/PublicExercise'
    ExerciseType:
      type: string
      enum:
        - LETTER_CHOICE
        - AUDIO_TO_LETTER
        - AUDIO_TO_WORD
        - MISSING_LETTER
        - MATCHING
        - WORD_ASSEMBLY
        - MULTIPLE_CHOICE
        - QUICK_ROUND
    SkillTag:
      type: string
      enum:
        - alphabet-recognition
        - special-letters
        - pronunciation
        - letter-case
        - word-recognition
