        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/StandardAttemptCreated'
    RetryAttemptCreatedResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/RetryAttemptCreated'
    AttemptCreated:
      type: object
      additionalProperties: false
      x-invariants:
        - exerciseCount must equal exercises.length and progress.exerciseCount
        - progress.totalPoints must equal the sum of exercises.maxPoints
      required:
        - attemptId
        - attemptToken
        - status
        - version
        - createdAt
        - idleExpiresAt
        - absoluteExpiresAt
        - effectiveExpiresAt
        - requestedLocale
        - resolvedLocale
        - currentQuestionNumber
        - exerciseCount
        - exercises
        - progress
      properties:
        attemptId:
          type: string
          format: uuid
        attemptToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Sensitive raw 256-bit base64url capability returned on creation or exact replay only.
          x-sensitive: true
        status:
          type: string
          const: IN_PROGRESS
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        effectiveExpiresAt:
          type: string
          format: date-time
        requestedLocale:
          $ref: '#/components/schemas/InterfaceLocale'
        resolvedLocale:
          $ref: '#/components/schemas/InterfaceLocale'
        currentQuestionNumber:
          type: integer
          const: 1
        exerciseCount:
          type: integer
          minimum: 1
          maximum: 12
        exercises:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          x-unique-by: id
          items:
            $ref: '#/components/schemas/PublicExercise'
        progress:
          $ref: '#/components/schemas/InitialAttemptProgress'
    InitialAttemptProgress:
      type: object
      additionalProperties: false
      required:
        - status
