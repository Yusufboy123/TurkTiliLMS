          AUDIO_TO_WORD: '#/components/schemas/AudioToWordExercise'
          MISSING_LETTER: '#/components/schemas/MissingLetterExercise'
          MATCHING: '#/components/schemas/MatchingExercise'
          WORD_ASSEMBLY: '#/components/schemas/WordAssemblyExercise'
