        - maxPoints must be greater than or equal to skillTags.length
      required: [id, type, version, prompt, instruction, skillTags, maxPoints, maxSubmissions]
      properties:
        id:
          type: string
          format: uuid
          description: Stable exercise aggregate UUID; not an immutable revision or placement ID.
        type:
          $ref: '#/components/schemas/ExerciseType'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Positive public revision number within the stable aggregate.
        prompt:
          $ref: '#/components/schemas/LocalizedText'
        instruction:
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: 'null'
        skillTags:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SkillTag'
        maxPoints:
          type: integer
          minimum: 1
          maximum: 100
        maxSubmissions:
          type: integer
          enum: [1, 2]
    Choice:
      type: object
      additionalProperties: false
      required: [id, label]
