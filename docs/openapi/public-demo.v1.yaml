            properties:
              outcome:
                const: INCORRECT_RETRY_ALLOWED
            required: [outcome]
          then:
            properties:
              feedback:
                properties:
                  correctConcept:
                    type: 'null'
                  example:
                    type: 'null'
                  replayMedia:
                    type: 'null'
              quickRoundBreakdown:
                type: 'null'
      required:
        - attemptId
        - exerciseId
        - version
        - outcome
        - canRetry
        - exercisePoints
        - progress
        - feedback
        - quickRoundBreakdown
        - nextExerciseId
      properties:
        attemptId:
          type: string
          format: uuid
        exerciseId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 2
        outcome:
          type: string
          enum: [CORRECT, INCORRECT_RETRY_ALLOWED, INCORRECT_FINAL]
        canRetry:
          type: boolean
        exercisePoints:
          $ref: '#/components/schemas/Points'
        progress:
          $ref: '#/components/schemas/AttemptProgress'
        feedback:
          $ref: '#/components/schemas/SafeFeedback'
        quickRoundBreakdown:
          oneOf:
            - type: array
              minItems: 2
              maxItems: 8
              uniqueItems: true
              x-unique-by: subPromptId
              items:
                $ref: '#/components/schemas/QuickRoundSubResult'
            - type: 'null'
        nextExerciseId:
          type: [string, 'null']
          format: uuid
    Points:
      type: object
      additionalProperties: false
      x-invariants:
        - earned must be less than or equal to maximum
      required: [earned, maximum]
      properties:
        earned:
          type: integer
          minimum: 0
        maximum:
          type: integer
          minimum: 1
    AttemptProgress:
      type: object
      additionalProperties: false
      x-invariants:
        - completedCount must equal correctCount plus incorrectCount
        - completedCount must be less than or equal to exerciseCount
        - earnedPoints must be less than or equal to totalPoints
        - status is COMPLETED if and only if completedCount equals exerciseCount
        - currentQuestionNumber must be completedCount plus one while IN_PROGRESS and exerciseCount when COMPLETED
      required:
        - status
        - currentQuestionNumber
        - exerciseCount
        - completedCount
        - correctCount
        - incorrectCount
        - earnedPoints
        - totalPoints
        - streak
        - xp
      properties:
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED]
        currentQuestionNumber:
          type: integer
          minimum: 1
          maximum: 12
        exerciseCount:
          type: integer
          minimum: 1
          maximum: 12
        completedCount:
          type: integer
          minimum: 0
          maximum: 12
        correctCount:
          type: integer
          minimum: 0
          maximum: 12
        incorrectCount:
          type: integer
          minimum: 0
          maximum: 12
        earnedPoints:
          type: integer
          minimum: 0
        totalPoints:
          type: integer
          minimum: 1
        streak:
          type: integer
          minimum: 0
          maximum: 12
        xp:
          type: integer
          minimum: 0
    SafeFeedback:
      type: object
      additionalProperties: false
      required: [title, message, explanation, correctConcept, example, replayMedia]
      properties:
        title:
          $ref: '#/components/schemas/LocalizedText'
        message:
          $ref: '#/components/schemas/LocalizedText'
        explanation:
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: 'null'
        correctConcept:
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: 'null'
          description: Human learning explanation only; never an answer identifier or grader rule.
        example:
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: 'null'
          description: Short Turkish learning example; never a machine answer definition.
        replayMedia:
          oneOf:
            - $ref: '#/components/schemas/TerminalFeedbackAudioReference'
            - type: 'null'
          description: Reachable managed audio that may be replayed with the feedback.
    QuickRoundSubResult:
      type: object
      additionalProperties: false
      required: [subPromptId, outcome, points, skillTag, feedback]
      properties:
        subPromptId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [CORRECT, INCORRECT]
        points:
          $ref: '#/components/schemas/Points'
        skillTag:
          $ref: '#/components/schemas/SkillTag'
        feedback:
          $ref: '#/components/schemas/SafeFeedback'
    AttemptResultResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AttemptResult'
    AttemptResult:
      type: object
      additionalProperties: false
      x-invariants:
        - earnedPoints must be less than or equal to totalPoints
        - percentage must equal floor(earnedPoints times 100 divided by totalPoints)
        - correctCount plus incorrectCount must equal perExercise.length and be less than or equal to exerciseCount
        - COMPLETED requires completedAt and perExercise.length equal to exerciseCount; IN_PROGRESS requires completedAt null
      required:
        - attemptId
        - status
        - version
        - idleExpiresAt
        - absoluteExpiresAt
        - effectiveExpiresAt
        - requestedLocale
        - resolvedLocale
        - completedAt
        - totalPoints
        - earnedPoints
        - percentage
        - correctCount
        - incorrectCount
        - exerciseCount
        - perExercise
        - perSkill
        - strongestSkills
        - skillsToPractice
        - actions
      properties:
        attemptId:
          type: string
          format: uuid
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED]
        version:
          type: integer
          format: int64
          minimum: 1
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        effectiveExpiresAt:
          type: string
          format: date-time
        requestedLocale:
          $ref: '#/components/schemas/InterfaceLocale'
        resolvedLocale:
          $ref: '#/components/schemas/InterfaceLocale'
        completedAt:
          type: [string, 'null']
          format: date-time
        totalPoints:
          type: integer
          minimum: 1
        earnedPoints:
          type: integer
          minimum: 0
        percentage:
          type: integer
          minimum: 0
          maximum: 100
        correctCount:
          type: integer
          minimum: 0
          maximum: 12
        incorrectCount:
          type: integer
          minimum: 0
          maximum: 12
        exerciseCount:
          type: integer
          minimum: 1
          maximum: 12
        perExercise:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/ExerciseResult'
        perSkill:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/SkillResult'
        strongestSkills:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SkillTag'
        skillsToPractice:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SkillTag'
        actions:
          $ref: '#/components/schemas/ResultActions'
    ExerciseResult:
      type: object
      additionalProperties: false
      x-invariants:
        - points.earned must be less than or equal to points.maximum
        - QUICK_ROUND requires attemptsUsed 1 and a non-null quickRoundBreakdown; every other type requires quickRoundBreakdown null
      required:
        [exerciseId, type, outcome, attemptsUsed, points, skillTags, feedback, quickRoundBreakdown]
      properties:
        exerciseId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ExerciseType'
        outcome:
          type: string
          enum: [CORRECT, INCORRECT]
        attemptsUsed:
          type: integer
          minimum: 1
          maximum: 2
        points:
          $ref: '#/components/schemas/Points'
        skillTags:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SkillTag'
        feedback:
          $ref: '#/components/schemas/SafeFeedback'
        quickRoundBreakdown:
          oneOf:
            - type: array
              minItems: 2
              maxItems: 8
              uniqueItems: true
              x-unique-by: subPromptId
              items:
                $ref: '#/components/schemas/QuickRoundSubResult'
            - type: 'null'
    SkillResult:
      type: object
      additionalProperties: false
      x-invariants:
        - earnedPoints must be less than or equal to totalPoints
        - percentage must equal floor(earnedPoints times 100 divided by totalPoints)
        - correctCount must be less than or equal to exerciseCount
      required:
        [skillTag, earnedPoints, totalPoints, percentage, correctCount, exerciseCount, level]
      properties:
        skillTag:
          $ref: '#/components/schemas/SkillTag'
        earnedPoints:
          type: integer
          minimum: 0
        totalPoints:
          type: integer
          minimum: 1
        percentage:
          type: integer
          minimum: 0
          maximum: 100
        correctCount:
          type: integer
          minimum: 0
        exerciseCount:
          type: integer
          minimum: 1
        level:
          type: string
          enum: [STRONG, DEVELOPING, PRACTICE]
    ResultActions:
      type: object
      additionalProperties: false
      required: [canRetryAll, canRetryIncorrect, canReview, contactCapability]
      properties:
        canRetryAll:
          type: boolean
        canRetryIncorrect:
          type: boolean
        canReview:
          type: boolean
        contactCapability:
          $ref: '#/components/schemas/ContactCapability'
    RetryAttemptRequest:
      type: object
      additionalProperties: false
      required: [mode, expectedVersion]
      properties:
        mode:
          type: string
          enum: [ALL, INCORRECT_ONLY]
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
    ResetAttemptRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, locale, audioMode]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        locale:
          $ref: '#/components/schemas/InterfaceLocale'
        audioMode:
          type: string
          enum: [AUDIO_ENABLED, TEXT_ALTERNATIVE]
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [success, code, message, requestId]
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]+$'
        message:
          type: string
          minLength: 1
          maxLength: 240
        requestId:
          type: string
          minLength: 1
          maxLength: 100
        details:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [path, message]
            properties:
              path:
                type: string
                maxLength: 120
              message:
                type: string
                maxLength: 240
  responses:
    DemoLessonNotFound:
      description: Demo slug is unknown or its canonical resource is not currently public.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            code: DEMO_LESSON_NOT_FOUND
            message: Demo dars topilmadi.
            requestId: req_01JZ8W4GE4J4Y3S4Z6FR2M7C9D
    AttemptCapabilityRequired:
      description: Capability header is missing, malformed, or wrong-length; rejected before attempt lookup.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            code: DEMO_ATTEMPT_AUTH_REQUIRED
            message: Demo urinishini davom ettirish uchun qayta boshlang.
            requestId: req_01JZ8W4GE4J4Y3S4Z6FR2M7C9D
    AttemptNotFound:
      description: Attempt ID is unknown or the well-formed capability does not match; cases are indistinguishable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            code: DEMO_ATTEMPT_NOT_FOUND
            message: Demo urinishi topilmadi.
            requestId: req_01JZ8W4GE4J4Y3S4Z6FR2M7C9D
    AttemptMediaNotFound:
      description: Attempt, capability match, media identity, or authorized exercise state is unavailable; all cases are indistinguishable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            code: DEMO_ATTEMPT_MEDIA_NOT_FOUND
            message: Audio topilmadi.
            requestId: req_01JZ8W4GE4J4Y3S4Z6FR2M7C9D
    AttemptGone:
      description: Matching capability belongs to an expired, abandoned, or revoked attempt.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            code: DEMO_ATTEMPT_GONE
            message: Demo urinishi yakunlangan. Yangisini boshlang.
            requestId: req_01JZ8W4GE4J4Y3S4Z6FR2M7C9D
    AttemptConflict:
      description: |
        Stable code is `ATTEMPT_VERSION_CONFLICT`, `IDEMPOTENCY_KEY_REUSED`,
        `EXERCISE_OUT_OF_ORDER`, `EXERCISE_ALREADY_TERMINAL`, or
        `RETRY_NOT_AVAILABLE`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ValidationFailure:
      description: Request validation failed without revealing grading information.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            code: VALIDATION_ERROR
            message: Kiritilgan ma’lumotlarni tekshiring.
            requestId: req_01JZ8W4GE4J4Y3S4Z6FR2M7C9D
            details: []
    RateLimited:
      description: Request limit exceeded.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            code: RATE_LIMIT_EXCEEDED
            message: Juda ko‘p urinish bo‘ldi. Birozdan keyin qayta urinib ko‘ring.
            requestId: req_01JZ8W4GE4J4Y3S4Z6FR2M7C9D
    InternalServerError:
      description: Unexpected failure with no internal details disclosed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            code: INTERNAL_SERVER_ERROR
            message: Kutilmagan xatolik yuz berdi. Keyinroq qayta urinib ko‘ring.
            requestId: req_01JZ8W4GE4J4Y3S4Z6FR2M7C9D
    PublicMediaNotFound:
      description: Media is unknown, unavailable, unsafe, or not reachable from the public preview.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            success: false
            code: PUBLIC_MEDIA_NOT_FOUND
            message: Audio topilmadi.
            requestId: req_01JZ8W4GE4J4Y3S4Z6FR2M7C9D
    HeadPublicMediaNotFound:
      description: Media is unknown, unavailable, unsafe, or not reachable from the public preview; no response body is returned.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
    HeadRateLimited:
      description: Request limit exceeded; no response body is returned.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
    HeadInternalServerError:
      description: Unexpected failure with no internal details or response body disclosed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
    HeadAttemptCapabilityRequired:
      description: Attempt capability is missing or malformed; no response body is returned.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
    HeadAttemptNotFound:
      description: Attempt, capability match, or authorized media state is unavailable; no response body is returned.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
    HeadAttemptGone:
      description: Matching attempt is expired, abandoned, or revoked; no response body is returned.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
    AttemptAudioContent:
      description: Complete authorized snapshot audio.
      headers:
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        Content-Disposition:
          $ref: '#/components/headers/SafeAudioDisposition'
        Content-Length:
          $ref: '#/components/headers/ContentLength'
        Content-Type:
          $ref: '#/components/headers/AudioContentType'
        ETag:
          $ref: '#/components/headers/ETag'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        audio/mpeg:
          schema:
            type: string
            format: binary
        audio/wav:
          schema:
            type: string
            format: binary
    AttemptPartialAudioContent:
