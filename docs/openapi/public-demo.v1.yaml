openapi: 3.1.0
info:
  title: Turk Tili LMS Public Demo API
  version: 1.0.0-rc.1
  description: |
    Module 9.5A contract for the public `Türk Alfabesi` preview lesson,
    reusable typed exercises, backend grading, ephemeral anonymous attempts,
    results, retries, reset, and resource-reachable pronunciation audio.
    Every operation is contract-only and unavailable until its named later
    phase is approved and implemented.
servers:
  - url: http://localhost:5000/api/v1
    description: Local development base path
tags:
  - name: Public Demo Lesson
  - name: Public Demo Attempt
  - name: Public Demo Media
paths:
  /public/demo-lessons/{demoSlug}:
    get:
      tags: [Public Demo Lesson]
      operationId: getPublicDemoLesson
      summary: Get a safe published preview lesson projection
      description: |
        Resolves a configured public demo slug to one real published course,
        visible section, and published `isPreview=true` lesson. Returns safe
        content and learning metadata, never exercise answers, grading rules,
        lesson metadata, storage paths, or unpublished resources.
      x-implementation-phase: Module 9.5C
      x-implementation-status: contract-only-not-available
      x-rate-limit-policy: 60 requests per 60 seconds per privacy-safe network HMAC
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoSlug'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Public demo lesson returned
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicRevalidate'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            Vary:
              $ref: '#/components/headers/VaryAcceptLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLessonResponse'
        '304':
          description: Cached public lesson projection remains current; no body
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicRevalidate'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            Vary:
              $ref: '#/components/headers/VaryAcceptLanguage'
        '404':
          $ref: '#/components/responses/DemoLessonNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /public/demo-lessons/{demoSlug}/attempts:
    post:
      tags: [Public Demo Attempt]
      operationId: createPublicDemoAttempt
      summary: Start an ephemeral anonymous demo attempt
      description: |
        Creates an immutable ordered snapshot. The raw 256-bit attempt token is
        returned on creation or exact replay and is reconstructed from managed
        key material; ordinary persistence retains only derivation metadata and
        its digest. No account,
        enrollment, progress, certificate, or personal-data record is created.
      x-implementation-phase: Module 9.5C
      x-implementation-status: contract-only-not-available
      x-rate-limit-policy: 10 create or reset requests per 15 minutes per privacy-safe network HMAC
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoSlug'
        - $ref: '#/components/parameters/CreationIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttemptRequest'
      responses:
        '201':
          description: Ephemeral attempt created
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Location:
              description: Relative result resource for the new attempt
              schema:
                type: string
                example: /api/v1/public/demo-attempts/8a7c0ad7-c1f5-42a4-a6e6-7d8cc45149cf/result
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardAttemptCreatedResponse'
        '404':
          $ref: '#/components/responses/DemoLessonNotFound'
        '409':
          $ref: '#/components/responses/AttemptConflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /public/demo-attempts/{attemptId}/answers:
    post:
      tags: [Public Demo Attempt]
      operationId: submitPublicDemoAnswer
      summary: Submit and grade the current exercise response
      description: |
        Validates the discriminated response against the immutable snapshot,
        serializes the attempt transition, grades on the backend, and returns
        safe feedback. Correct answer identifiers and grading definitions are
        never returned.
      x-implementation-phase: Module 9.5C
      x-implementation-status: contract-only-not-available
      x-rate-limit-policy: 60 requests per 5 minutes per attempt and 120 per 5 minutes per privacy-safe network HMAC
      security:
        - demoAttemptToken: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '200':
          description: Answer graded or original idempotent response replayed
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerFeedbackResponse'
        '401':
          $ref: '#/components/responses/AttemptCapabilityRequired'
        '404':
          $ref: '#/components/responses/AttemptNotFound'
        '409':
          $ref: '#/components/responses/AttemptConflict'
        '410':
          $ref: '#/components/responses/AttemptGone'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /public/demo-attempts/{attemptId}/result:
    get:
      tags: [Public Demo Attempt]
      operationId: getPublicDemoAttemptResult
      summary: Get authoritative attempt progress or completed result
      description: |
        Returns server-derived totals, per-skill evidence, and safe
        per-exercise review. It never returns correct choice, pair, order, word,
        normalization, randomization seed, or private grader fields. This read
        never extends idle expiry or increments attempt version.
      x-implementation-phase: Module 9.5C
      x-implementation-status: contract-only-not-available
      x-rate-limit-policy: 30 requests per 60 seconds per attempt
      security:
        - demoAttemptToken: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Attempt progress or result returned
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResultResponse'
        '401':
          $ref: '#/components/responses/AttemptCapabilityRequired'
        '404':
          $ref: '#/components/responses/AttemptNotFound'
        '410':
          $ref: '#/components/responses/AttemptGone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /public/demo-attempts/{attemptId}/retries:
    post:
      tags: [Public Demo Attempt]
      operationId: retryPublicDemoAttempt
      summary: Create a fresh all or incorrect-only retry attempt
      description: |
        Creates a child attempt with a new raw capability. `INCORRECT_ONLY` is
        allowed only for a completed attempt with terminal incorrect exercises.
        Selection and order copy the immutable parent snapshot; no current
        exercise revision is substituted. Exact replay reconstructs the same
        child token without a second mutation.
      x-implementation-phase: Module 9.5C
      x-implementation-status: contract-only-not-available
      x-rate-limit-policy: 5 requests per hour per attempt lineage and 20 per hour per privacy-safe network HMAC
      security:
        - demoAttemptToken: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryAttemptRequest'
      responses:
        '201':
          description: Retry attempt created
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Location:
              description: Relative result resource for the new attempt
              schema:
                type: string
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryAttemptCreatedResponse'
        '401':
          $ref: '#/components/responses/AttemptCapabilityRequired'
        '404':
          $ref: '#/components/responses/AttemptNotFound'
        '409':
          $ref: '#/components/responses/AttemptConflict'
        '410':
          $ref: '#/components/responses/AttemptGone'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /public/demo-attempts/{attemptId}/reset:
    post:
      tags: [Public Demo Attempt]
      operationId: resetPublicDemoAttempt
      summary: Abandon and replace an active attempt
      description: |
        Atomically marks the current attempt abandoned, invalidates its raw
        capability for normal use, and returns an unrelated current-curriculum
        attempt and token. A bounded replay-only old digest may reproduce only
        the exact successful reset response.
      x-implementation-phase: Module 9.5C
      x-implementation-status: contract-only-not-available
      x-rate-limit-policy: 10 create or reset requests per 15 minutes per privacy-safe network HMAC
      security:
        - demoAttemptToken: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetAttemptRequest'
      responses:
        '201':
          description: Replacement attempt created and old capability invalidated
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Location:
              description: Relative result resource for the replacement attempt
              schema:
                type: string
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardAttemptCreatedResponse'
        '401':
          $ref: '#/components/responses/AttemptCapabilityRequired'
        '404':
          $ref: '#/components/responses/AttemptNotFound'
        '409':
          $ref: '#/components/responses/AttemptConflict'
        '410':
          $ref: '#/components/responses/AttemptGone'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /public/demo-attempts/{attemptId}/media/{mediaId}:
    get:
      tags: [Public Demo Media]
      operationId: streamPublicDemoAttemptMedia
      summary: Stream capability-protected snapshot audio
      description: |
        Streams managed exercise-prompt audio from the matching unexpired
        snapshot or terminal-feedback audio only after its exercise is terminal.
        The attempt capability and current media-state authorization are checked
        on every request. No read extends expiry or attempt version.
      x-implementation-phase: Module 9.5C
      x-implementation-status: contract-only-not-available
      x-rate-limit-policy: 120 requests per minute per privacy-safe network HMAC and 30 per minute per media ID
      security:
        - demoAttemptToken: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/AttemptAudioContent'
        '206':
          $ref: '#/components/responses/AttemptPartialAudioContent'
        '304':
          description: Cached private representation remains current
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
        '401':
          $ref: '#/components/responses/AttemptCapabilityRequired'
        '404':
          $ref: '#/components/responses/AttemptMediaNotFound'
        '410':
          $ref: '#/components/responses/AttemptGone'
        '416':
          $ref: '#/components/responses/AttemptRangeNotSatisfiable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    head:
      tags: [Public Demo Media]
      operationId: headPublicDemoAttemptMedia
      summary: Inspect capability-protected snapshot audio headers
      description: |
        Applies the same attempt and media-state authorization as GET and returns
        no body. Terminal-feedback media remains unavailable until its exercise
        is terminal. This read never extends expiry or attempt version.
      x-implementation-phase: Module 9.5C
      x-implementation-status: contract-only-not-available
      x-rate-limit-policy: 120 requests per minute per privacy-safe network HMAC and 30 per minute per media ID
      security:
        - demoAttemptToken: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Authorized snapshot audio metadata returned without a body
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            Content-Type:
              $ref: '#/components/headers/AudioContentType'
            Content-Disposition:
              $ref: '#/components/headers/SafeAudioDisposition'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '304':
          description: Cached private representation remains current
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
        '401':
          $ref: '#/components/responses/HeadAttemptCapabilityRequired'
        '404':
          $ref: '#/components/responses/HeadAttemptNotFound'
        '410':
          $ref: '#/components/responses/HeadAttemptGone'
        '429':
          $ref: '#/components/responses/HeadRateLimited'
        '500':
          $ref: '#/components/responses/HeadInternalServerError'
  /public/demo-lessons/{demoSlug}/media/{mediaId}:
    get:
      tags: [Public Demo Media]
      operationId: streamPublicDemoPronunciationMedia
      summary: Stream currently public explanatory lesson audio
      description: |
        Revalidates that the managed, non-deleted, inspected audio file is
        referenced by the currently public explanatory lesson-block projection.
        Snapshot prompt and terminal-feedback media use the capability-protected
        attempt-media route. Supports one GET byte range and never redirects to
        authored remote URLs or exposes a storage path.
      x-implementation-phase: Module 9.5C
      x-implementation-status: contract-only-not-available
      x-rate-limit-policy: 120 requests per minute per privacy-safe network HMAC and 30 per minute per media ID
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoSlug'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/AudioContent'
        '206':
          $ref: '#/components/responses/PartialAudioContent'
        '304':
          description: Cached representation remains current
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicMediaRevalidate'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
        '404':
          $ref: '#/components/responses/PublicMediaNotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
    head:
      tags: [Public Demo Media]
      operationId: headPublicDemoPronunciationMedia
      summary: Inspect currently public explanatory lesson audio headers
      x-implementation-phase: Module 9.5C
      x-implementation-status: contract-only-not-available
      x-rate-limit-policy: 120 requests per minute per privacy-safe network HMAC and 30 per minute per media ID
      security: []
      parameters:
        - $ref: '#/components/parameters/DemoSlug'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Reachable audio metadata returned without a body
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Cache-Control:
              $ref: '#/components/headers/PublicMediaRevalidate'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            Content-Type:
              $ref: '#/components/headers/AudioContentType'
            Content-Disposition:
              $ref: '#/components/headers/SafeAudioDisposition'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
        '304':
          description: Cached representation remains current
          headers:
            Cache-Control:
              $ref: '#/components/headers/PublicMediaRevalidate'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
        '404':
          $ref: '#/components/responses/HeadPublicMediaNotFound'
        '429':
          $ref: '#/components/responses/HeadRateLimited'
        '500':
          $ref: '#/components/responses/HeadInternalServerError'
components:
  securitySchemes:
    demoAttemptToken:
      type: apiKey
      in: header
      name: X-Demo-Attempt-Token
      description: Exact 43-character base64url 256-bit capability; memory-only in clients and never logged.
  parameters:
    DemoSlug:
      name: demoSlug
      in: path
      required: true
      description: Configured public demo slug; v1 supports `turk-alfabesi`.
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        minLength: 3
        maxLength: 80
      example: turk-alfabesi
    AttemptId:
      name: attemptId
      in: path
      required: true
      description: Non-secret attempt UUID; authority still requires the attempt token.
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Managed media UUID whose lesson reachability is revalidated.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required for capability-authorized answer/retry/reset commands. Bound to
        operation scope and canonical fingerprint for a 15-minute exact replay
        window.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
    CreationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Cryptographically random client-generated UUIDv4 required for anonymous
        attempt creation. Its unguessability prevents cross-user replay within a
        shared network-HMAC scope.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    Range:
      name: Range
      in: header
      required: false
      description: One RFC 9110 byte range; multipart ranges are rejected.
      schema:
        type: string
        pattern: '^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Interface-locale preference; resolved deterministically with uz-Latn fallback.
      schema:
        type: string
        maxLength: 200
  headers:
    PrivateNoStore:
      description: Prevents persistence of attempt capabilities and private attempt state.
      schema:
        type: string
        const: private, no-store
    PublicRevalidate:
      description: Requires revalidation so publication/mapping revocation takes effect on next use.
      schema:
        type: string
        const: public, max-age=0, must-revalidate
    VaryAcceptLanguage:
      description: Keeps localized public lesson representations in distinct cache variants.
      schema:
        type: string
        const: Accept-Language
    PublicMediaRevalidate:
      description: Requires revalidation so publication/media revocation takes effect on next use.
      schema:
        type: string
        const: public, max-age=0, must-revalidate
    ETag:
      description: Strong representation validator that changes when the projection or media changes.
      schema:
        type: string
    RateLimit:
      description: Combined limit, remaining, and reset information.
      schema:
        type: string
    RateLimitPolicy:
      description: Applied request-window policy.
      schema:
        type: string
    RetryAfter:
      description: Seconds until a request may be retried.
      schema:
        type: integer
        minimum: 1
    IdempotencyReplayed:
      description: Whether the response is the stored result of the same key and fingerprint.
      schema:
        type: string
        enum: ['true', 'false']
    AcceptRanges:
      description: Supported range unit.
      schema:
        type: string
        const: bytes
    ContentLength:
      description: Representation length in bytes.
      schema:
        type: integer
        format: int64
        minimum: 0
    AudioContentType:
      description: Inspected and allowlisted audio MIME type.
      schema:
        type: string
        enum: [audio/mpeg, audio/wav]
    ContentRange:
      description: Served byte range and full representation length.
      schema:
        type: string
        pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$'
    UnsatisfiedContentRange:
      description: Unsatisfied byte range and full representation length.
      schema:
        type: string
        pattern: '^bytes \*/[0-9]+$'
    NoSniff:
      description: Prevents MIME sniffing.
      schema:
        type: string
        const: nosniff
    SafeAudioDisposition:
      description: Inline disposition with a server-generated safe filename.
      schema:
        type: string
        pattern: '^inline; filename="[A-Za-z0-9._-]+"$'
  schemas:
    ApiSuccessBase:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          minLength: 1
          maxLength: 240
    DemoLessonResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DemoLesson'
    DemoLesson:
      type: object
      additionalProperties: false
      required:
        - slug
        - requestedLocale
        - resolvedLocale
        - course
        - section
        - lesson
        - estimatedMinutes
        - learningOutcomes
        - contentBlocks
        - exerciseCount
        - supportedExerciseTypes
        - contactCapability
      properties:
        slug:
          type: string
          const: turk-alfabesi
        requestedLocale:
          description: First supported requested locale after approved alias normalization; null when the header is absent or has no supported preference.
          oneOf:
            - $ref: '#/components/schemas/InterfaceLocale'
            - type: 'null'
        resolvedLocale:
          $ref: '#/components/schemas/InterfaceLocale'
        course:
          $ref: '#/components/schemas/PublicCourseIdentity'
        section:
          $ref: '#/components/schemas/PublicSectionIdentity'
        lesson:
          $ref: '#/components/schemas/PublicPreviewLessonIdentity'
        estimatedMinutes:
          type: integer
          minimum: 1
          maximum: 30
          example: 10
        learningOutcomes:
          type: array
          minItems: 1
          maxItems: 8
