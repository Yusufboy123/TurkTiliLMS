openapi: 3.0.3
info:
  title: TurkTiliLMS Student Productivity API
  version: 1.0.0
paths:
  /api/v1/me/bookmarks:
    get:
      summary: List the authenticated student's bookmarks
      security: [{ bearerAuth: [] }]
      responses: {'200': {description: Bookmark list}}
    post:
      summary: Create or return an owned lesson or vocabulary bookmark
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lessonId: {type: string, format: uuid}
                vocabularyId: {type: string, format: uuid}
      responses: {'201': {description: Bookmark created}}
  /api/v1/me/bookmarks/{bookmarkId}:
    delete:
      summary: Delete an owned bookmark
      security: [{ bearerAuth: [] }]
      parameters: [{name: bookmarkId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Bookmark deleted}}
  /api/v1/me/lessons/{lessonId}/note:
    get:
      summary: Read the authenticated student's private lesson note
      security: [{ bearerAuth: [] }]
      parameters: [{name: lessonId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Note or null}}
    put:
      summary: Create or update a private lesson note
      security: [{ bearerAuth: [] }]
      parameters: [{name: lessonId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Note saved}}
    delete:
      summary: Delete a private lesson note
      security: [{ bearerAuth: [] }]
      parameters: [{name: lessonId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Note deleted}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
